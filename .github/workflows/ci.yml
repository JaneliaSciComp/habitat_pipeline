name: Habitat Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy

    - name: Install package
      run: |
        pip install -e .

    - name: Lint with flake8
      run: |
        flake8 src/habitat_pipeline --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/habitat_pipeline --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check src/habitat_pipeline

    - name: Type check with mypy
      run: |
        mypy src/habitat_pipeline --ignore-missing-imports || true

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=habitat_pipeline --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t habitat_pipeline:latest .

    - name: Test Docker image
      run: |
        docker run --rm habitat_pipeline:latest python -c "import habitat_pipeline; print(habitat_pipeline.__version__)"
