# Habitat Pipeline - Conda Environment Configuration
# Create environment: conda env create -f environment.yml
# Activate: conda activate habitat-pipeline
# Update: conda env update -f environment.yml

name: habitat-pipeline

channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.8

  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0

  # Machine learning and statistics  
  - scikit-learn>=1.0.0

  # Visualization and plotting
  - matplotlib>=3.5.0
  - seaborn>=0.11.0

  # File I/O and data handling
  - h5py>=3.6.0
  
  # Jupyter ecosystem for interactive analysis
  - jupyter
  - ipykernel
  - jupyterlab

  # Development tools
  - pytest>=6.0.0
  - pytest-cov>=3.0.0

  # Performance optimization
  - numba>=0.56.0

  # Optional video processing dependencies
  # - opencv
  # - ffmpeg

  # Pip dependencies (if not available via conda)
  - pip
  - pip:
    # Add any pip-only packages here if needed
    # - some-pip-only-package
