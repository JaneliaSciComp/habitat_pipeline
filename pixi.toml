[project]
name = "habitat-pipeline"
version = "0.1.0"
description = "Multi-Animal Electrophysiology and Behavior Analysis Pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.8"
numpy = ">=1.21.0"
pandas = ">=1.3.0"
scipy = ">=1.7.0"
scikit-learn = ">=1.0.0"
matplotlib = ">=3.5.0"
seaborn = ">=0.11.0"
h5py = ">=3.6.0"

[feature.dev.dependencies]
pytest = ">=6.0.0"
pytest-cov = ">=3.0.0"
jupyter = ">=1.0.0"
jupyterlab = "*"
ipykernel = ">=6.0.0"

[environments]
dev = ["dev"]
