[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat-pipeline"
version = "0.1.0"
description = "Multi-Animal Electrophysiology and Behavior Analysis Pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mikhail Proskurin", email = "proskurinm@janelia.hhmi.org"}]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0", 
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "h5py>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "jupyter>=1.0.0",
]
all = [
    "pytest>=6.0.0",
    "black>=22.0.0", 
    "jupyter>=1.0.0",
    "opencv-python>=4.5.0",
    "sqlalchemy>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/JaneliaSciComp/habitat_pipeline"

[tool.setuptools.packages.find]
include = ["ingestion*", "video*", "ephys*", "database*"]